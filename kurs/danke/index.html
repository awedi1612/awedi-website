<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kursbereich — Zahlen. Preise. Gewinn.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    :root {
      --bg:        #0C0B09;
      --bg2:       #131108;
      --bg3:       #1A1710;
      --gold:      #C4882C;
      --gold-lt:   #F0B650;
      --gold-dim:  rgba(196,136,44,0.12);
      --gold-line: rgba(196,136,44,0.22);
      --text:      #E8E2D5;
      --muted:     #7A7066;
      --faint:     #3A3530;
      --sidebar-w: 288px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      line-height: 1.6;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── HEADER ── */
    header {
      position: sticky; top: 0; z-index: 100;
      height: 60px;
      background: rgba(12,11,9,0.94);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--faint);
      display: flex; align-items: center;
      padding: 0 20px; gap: 14px;
    }
    .logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.1rem; font-weight: 600;
      letter-spacing: .04em;
      color: var(--text);
      text-decoration: none;
      white-space: nowrap;
    }
    .logo span { color: var(--gold); }
    .header-sep { width: 1px; height: 18px; background: var(--faint); flex-shrink: 0; }
    .header-course {
      font-size: .78rem; color: var(--muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      flex: 1;
    }

    .progress-wrap { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
    .progress-track {
      width: 96px; height: 3px;
      background: var(--faint); border-radius: 99px; overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--gold), var(--gold-lt));
      border-radius: 99px;
      transition: width .4s ease;
    }
    .progress-label { font-size: .7rem; color: var(--muted); }

    .btn-vorlage {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--gold-dim);
      border: 1px solid var(--gold-line);
      color: var(--gold); font-size: .72rem; font-weight: 600;
      letter-spacing: .04em;
      padding: 6px 14px; border-radius: 3px;
      text-decoration: none; white-space: nowrap;
      transition: background .15s, border-color .15s;
    }
    .btn-vorlage:hover { background: rgba(196,136,44,0.2); border-color: var(--gold); }

    .sidebar-toggle {
      display: none;
      background: var(--bg3); border: 1px solid var(--faint);
      border-radius: 3px; width: 32px; height: 32px;
      align-items: center; justify-content: center;
      cursor: pointer; color: var(--muted); flex-shrink: 0;
      transition: border-color .15s, color .15s;
    }
    .sidebar-toggle:hover { border-color: var(--gold-line); color: var(--gold); }

    /* ── LAYOUT ── */
    .layout {
      flex: 1;
      display: flex;
      height: calc(100vh - 60px);
    }

    /* ── SIDEBAR ── */
    aside {
      width: var(--sidebar-w);
      flex-shrink: 0;
      border-right: 1px solid var(--faint);
      background: var(--bg2);
      overflow-y: auto;
      overflow-x: hidden;
    }
    aside::-webkit-scrollbar { width: 3px; }
    aside::-webkit-scrollbar-track { background: transparent; }
    aside::-webkit-scrollbar-thumb { background: var(--faint); border-radius: 99px; }

    .module-block { border-bottom: 1px solid var(--faint); }

    .module-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px;
      cursor: pointer;
      transition: background .15s;
      user-select: none;
    }
    .module-header:hover { background: rgba(196,136,44,0.04); }
    .module-header.active { background: rgba(196,136,44,0.06); }

    .mod-num {
      font-size: .62rem; font-weight: 700; letter-spacing: .12em;
      text-transform: uppercase; color: var(--gold);
      margin-bottom: 3px;
    }
    .mod-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: .95rem; font-weight: 600;
      color: var(--text); line-height: 1.25;
    }
    .mod-meta { font-size: .68rem; color: var(--muted); margin-top: 2px; }

    .chevron {
      flex-shrink: 0; color: var(--muted);
      transition: transform .25s;
    }
    .module-header.open .chevron { transform: rotate(90deg); }

    .lessons-list {
      max-height: 0; overflow: hidden;
      transition: max-height .3s ease;
    }
    .lessons-list.open { max-height: 640px; }

    .lesson-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 16px 8px 22px;
      cursor: pointer;
      border-left: 2px solid transparent;
      transition: background .12s, border-color .12s;
    }
    .lesson-item:hover { background: rgba(196,136,44,0.05); }
    .lesson-item.active {
      background: rgba(196,136,44,0.08);
      border-left-color: var(--gold);
    }

    .check-circle {
      width: 17px; height: 17px; flex-shrink: 0;
      border-radius: 50%;
      border: 1.5px solid var(--faint);
      display: flex; align-items: center; justify-content: center;
      transition: all .2s;
    }
    .lesson-item.done .check-circle {
      background: var(--gold); border-color: var(--gold);
    }
    .lesson-item.active .check-circle {
      border-color: var(--gold-line);
    }

    .les-title {
      font-size: .79rem; color: var(--muted); line-height: 1.3; flex: 1;
      transition: color .12s;
    }
    .lesson-item.active .les-title { color: var(--text); }

    /* ── MAIN ── */
    main {
      flex: 1; overflow-y: auto;
      display: flex; flex-direction: column;
    }

    /* ── VIDEO AREA ── */
    .video-area {
      background: #080806;
      width: 100%;
      aspect-ratio: 16/9;
      max-height: 62vh;
      flex-shrink: 0;
      position: relative;
      user-select: none;
    }

    #player {
      width: 100%; height: 100%;
      display: block;
      cursor: pointer;
    }

    .placeholder {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      pointer-events: none;
    }
    .placeholder-ring {
      width: 64px; height: 64px;
      border: 1.5px solid var(--gold-line);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }
    .placeholder p {
      font-size: .78rem; color: var(--muted);
      letter-spacing: .08em; text-transform: uppercase;
    }

    /* ── CUSTOM VIDEO CONTROLS ── */
    .v-controls {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.88) 0%, rgba(0,0,0,0.4) 60%, transparent 100%);
      padding: 36px 14px 12px;
      z-index: 10;
      opacity: 0;
      transition: opacity .22s;
      pointer-events: none;
    }
    .video-area.has-src:hover .v-controls,
    .video-area.has-src.paused .v-controls {
      opacity: 1;
      pointer-events: auto;
    }

    .v-progress-wrap {
      margin-bottom: 10px;
      padding: 5px 0;
      cursor: pointer;
    }
    .v-progress-bg {
      height: 3px;
      background: rgba(255,255,255,0.18);
      border-radius: 99px;
      position: relative;
      transition: height .15s;
    }
    .v-progress-wrap:hover .v-progress-bg,
    .v-progress-wrap.scrubbing .v-progress-bg { height: 4px; }

    .v-progress-fill {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      background: linear-gradient(90deg, var(--gold), var(--gold-lt));
      border-radius: 99px;
      width: 0%;
      pointer-events: none;
    }
    .v-progress-thumb {
      position: absolute;
      top: 50%; left: 0%;
      width: 13px; height: 13px;
      background: var(--gold-lt);
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(0);
      box-shadow: 0 0 8px rgba(240,182,80,0.55);
      pointer-events: none;
      transition: transform .15s;
    }
    .v-progress-wrap:hover .v-progress-thumb,
    .v-progress-wrap.scrubbing .v-progress-thumb { transform: translate(-50%, -50%) scale(1); }

    .v-bar {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .v-btn {
      background: none; border: none;
      color: rgba(232,226,213,0.85); cursor: pointer;
      width: 30px; height: 30px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 3px;
      transition: color .15s;
      flex-shrink: 0;
      padding: 0;
    }
    .v-btn:hover { color: var(--gold-lt); }

    .v-time {
      font-size: .7rem;
      color: rgba(232,226,213,0.6);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      letter-spacing: .01em;
      min-width: 86px;
    }

    .v-spacer { flex: 1; }

    .v-speed {
      appearance: none;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.14);
      color: rgba(232,226,213,0.8);
      font-size: .7rem;
      font-family: 'DM Sans', sans-serif;
      padding: 3px 8px;
      border-radius: 3px;
      cursor: pointer;
      outline: none;
      transition: border-color .15s, color .15s;
    }
    .v-speed:hover { border-color: var(--gold-line); color: var(--text); }
    .v-speed option { background: #1A1710; color: var(--text); }

    /* click feedback flash */
    .v-flash {
      position: absolute;
      inset: 0;
      display: flex; align-items: center; justify-content: center;
      pointer-events: none;
      z-index: 9;
    }
    .v-flash-ring {
      width: 56px; height: 56px;
      border: 2px solid rgba(196,136,44,0.7);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.35);
      opacity: 0;
      transition: opacity .06s;
    }
    .v-flash-ring.show { opacity: 1; }
    .v-flash-ring.hide { opacity: 0; transition: opacity .4s; }

    /* ── LESSON INFO ── */
    .lesson-info {
      padding: 24px 32px 20px;
      border-bottom: 1px solid var(--faint);
    }
    .info-top {
      display: flex; align-items: flex-start;
      justify-content: space-between; gap: 20px;
    }
    .lesson-badge {
      font-size: .66rem; font-weight: 600; letter-spacing: .12em;
      text-transform: uppercase; color: var(--gold);
      margin-bottom: 8px;
    }
    #current-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.3rem, 2vw, 1.8rem);
      font-weight: 700; line-height: 1.2;
      color: var(--text);
    }

    .nav-btns { display: flex; gap: 10px; flex-shrink: 0; margin-top: 2px; }
    .nav-btn {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: .76rem; font-weight: 600;
      padding: 7px 16px; border-radius: 3px;
      border: 1px solid var(--faint);
      background: transparent;
      color: var(--muted); cursor: pointer;
      transition: all .15s;
    }
    .nav-btn:hover:not(:disabled) { border-color: var(--gold-line); color: var(--text); }
    .nav-btn.primary {
      background: var(--gold);
      color: #0C0B09; border: none;
      font-weight: 700;
    }
    .nav-btn.primary:hover:not(:disabled) { background: var(--gold-lt); }
    .nav-btn:disabled { opacity: .3; cursor: default; }

    .vorlage-card {
      margin: 24px 32px;
      background: var(--bg3);
      border: 1px solid var(--gold-line);
      border-radius: 6px;
      padding: 24px 28px;
      display: flex; align-items: center; gap: 20px;
      position: relative; overflow: hidden;
    }
    .vorlage-card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--gold), var(--gold-lt), var(--gold));
    }
    .vorlage-icon {
      width: 42px; height: 42px; flex-shrink: 0;
      background: var(--gold-dim);
      border: 1px solid var(--gold-line);
      border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
    }
    .vorlage-card h3 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.15rem; font-weight: 600;
      color: var(--text); margin-bottom: 3px;
    }
    .vorlage-card p { font-size: .8rem; color: var(--muted); }
    .btn-dl {
      margin-left: auto; flex-shrink: 0;
      display: inline-flex; align-items: center; gap: 7px;
      background: var(--gold); color: #0C0B09;
      font-size: .76rem; font-weight: 700; letter-spacing: .04em;
      padding: 9px 20px; border-radius: 3px;
      text-decoration: none;
      transition: background .15s, transform .15s;
      white-space: nowrap;
    }
    .btn-dl:hover { background: var(--gold-lt); transform: translateY(-1px); }

    /* ── PASSWORD GATE ── */
    .gate {
      position: fixed; inset: 0; z-index: 999;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .gate-box {
      width: 100%; max-width: 380px;
      background: var(--bg2);
      border: 1px solid var(--faint);
      border-radius: 8px;
      padding: 40px 36px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .gate-box::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, var(--gold), var(--gold-lt), var(--gold));
    }
    .gate-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.4rem; font-weight: 600;
      letter-spacing: .04em; color: var(--text);
      margin-bottom: 6px;
    }
    .gate-logo span { color: var(--gold); }
    .gate-sub {
      font-size: .78rem; color: var(--muted);
      margin-bottom: 28px; line-height: 1.5;
    }
    .gate-field {
      display: flex; gap: 8px;
      margin-bottom: 10px;
    }
    .gate-field input {
      flex: 1;
      background: var(--bg3);
      border: 1px solid var(--faint);
      border-radius: 3px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: .85rem;
      padding: 10px 14px;
      outline: none;
      transition: border-color .15s;
    }
    .gate-field input:focus { border-color: var(--gold-line); }
    .gate-field input::placeholder { color: var(--muted); }
    .gate-field button {
      background: var(--gold); color: #0C0B09;
      border: none; border-radius: 3px;
      font-family: 'DM Sans', sans-serif;
      font-size: .82rem; font-weight: 700;
      padding: 10px 18px; cursor: pointer;
      white-space: nowrap;
      transition: background .15s;
    }
    .gate-field button:hover { background: var(--gold-lt); }
    .gate-error {
      font-size: .75rem; color: #e05a5a;
      min-height: 18px;
    }

    @media (max-width: 780px) {
      aside {
        position: fixed; top: 60px; left: 0; bottom: 0; z-index: 50;
        transform: translateX(-100%);
        transition: transform .28s ease;
        box-shadow: 4px 0 24px rgba(0,0,0,.6);
        width: 280px;
      }
      aside.open { transform: translateX(0); }
      .sidebar-toggle { display: flex; }
      .progress-wrap { display: none; }
      .lesson-info { padding: 16px 16px 14px; }
      .info-top { flex-direction: column; gap: 12px; }
      .vorlage-card { margin: 16px; flex-wrap: wrap; }
      .btn-dl { margin-left: 0; width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>

<!-- PASSWORD GATE -->
<div class="gate" id="gate">
  <div class="gate-box">
    <div class="gate-logo">Zahlen.<span>Preise.</span>Gewinn.</div>
    <p class="gate-sub">Kursbereich — bitte gib dein Zugangspasswort ein</p>
    <div class="gate-field">
      <input type="password" id="gate-input" placeholder="Passwort" onkeydown="if(event.key==='Enter')checkGate()">
      <button onclick="checkGate()">Zugang →</button>
    </div>
    <p class="gate-error" id="gate-error"></p>
  </div>
</div>

<header>
  <button class="sidebar-toggle" onclick="toggleSidebar()" aria-label="Menü">
    <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
  <a href="/kurs" class="logo">Zahlen.<span>Preise.</span>Gewinn.</a>
  <div class="header-sep"></div>
  <span class="header-course">Kursbereich</span>
  <div class="progress-wrap">
    <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    <span class="progress-label" id="progress-label">0 / 33</span>
  </div>
  <a href="https://docs.google.com/spreadsheets/d/1AuVFD_TV_eAw_Omo5hLyuLqPFURhiseVwtFy97RfA04/copy"
     target="_blank" class="btn-vorlage">
    <svg width="11" height="11" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M12 15V3m0 12l-4-4m4 4l4-4M2 17l.621 2.485A2 2 0 004.561 21h14.878a2 2 0 001.94-1.515L22 17"/></svg>
    Vorlage
  </a>
</header>

<div class="layout">
  <aside id="sidebar"></aside>

  <main>
    <div class="video-area" id="video-area" onclick="handleVideoClick(event)">
      <video id="player" preload="metadata"></video>

      <div class="placeholder" id="placeholder">
        <div class="placeholder-ring">
          <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="#C4882C" stroke-width="1.5"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        </div>
        <p>Lektion wählen</p>
      </div>

      <!-- click flash feedback -->
      <div class="v-flash" id="v-flash">
        <div class="v-flash-ring" id="v-flash-ring">
          <svg id="v-flash-icon" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="#F0B650" stroke-width="2"></svg>
        </div>
      </div>

      <!-- custom controls -->
      <div class="v-controls" id="v-controls" onclick="event.stopPropagation()">
        <div class="v-progress-wrap" id="v-progress-wrap">
          <div class="v-progress-bg" id="v-progress-bg">
            <div class="v-progress-fill" id="v-progress-fill"></div>
            <div class="v-progress-thumb" id="v-progress-thumb"></div>
          </div>
        </div>
        <div class="v-bar">
          <button class="v-btn" id="v-play-btn" onclick="togglePlay()" title="Play/Pause">
            <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3" fill="currentColor" stroke="none"/></svg>
          </button>
          <span class="v-time" id="v-time">0:00 / 0:00</span>
          <div class="v-spacer"></div>
          <select class="v-speed" id="v-speed" onchange="changeSpeed(this.value)" title="Abspielgeschwindigkeit">
            <option value="0.75">0.75×</option>
            <option value="1" selected>1×</option>
            <option value="1.25">1.25×</option>
            <option value="1.5">1.5×</option>
            <option value="2">2×</option>
          </select>
          <button class="v-btn" id="v-fs-btn" onclick="toggleFullscreen()" title="Vollbild">
            <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 00-2 2v3m18 0V5a2 2 0 00-2-2h-3m0 18h3a2 2 0 002-2v-3M3 16v3a2 2 0 002 2h3"/></svg>
          </button>
        </div>
      </div>
    </div>

    <div class="lesson-info">
      <div class="info-top">
        <div>
          <div class="lesson-badge" id="current-badge">Modul 1 · Lektion 1</div>
          <h2 id="current-title">Willkommen im Kurs</h2>
        </div>
        <div class="nav-btns">
          <button class="nav-btn" id="btn-prev" onclick="navLesson(-1)" disabled>
            <svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
            Zurück
          </button>
          <button class="nav-btn primary" id="btn-next" onclick="navLesson(1)" disabled>
            Weiter
            <svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>
      </div>
    </div>

    <div class="vorlage-card">
      <div class="vorlage-icon">
        <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="#C4882C" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="1"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
      </div>
      <div>
        <h3>Kalkulations-Vorlage</h3>
        <p>Google Sheets — alle Formeln eingebaut, sofort einsatzbereit</p>
      </div>
      <a href="https://docs.google.com/spreadsheets/d/1AuVFD_TV_eAw_Omo5hLyuLqPFURhiseVwtFy97RfA04/copy"
         target="_blank" class="btn-dl">
        <svg width="12" height="12" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M12 15V3m0 12l-4-4m4 4l4-4M2 17l.621 2.485A2 2 0 004.561 21h14.878a2 2 0 001.94-1.515L22 17"/></svg>
        Kopie erstellen
      </a>
    </div>
  </main>
</div>

<script>
const curriculum = [
  {
    title: "Die Grundlage",
    lessons: [
      { id: "01_01", title: "Willkommen" },
      { id: "01_02", title: "Warum Preise falsch sind" },
      { id: "01_03", title: "Die 3 wichtigen Zahlen" },
      { id: "01_04", title: "Wie alles zusammenhängt" },
    ]
  },
  {
    title: "Wareneinsatz",
    lessons: [
      { id: "02_01", title: "Einführung Wareneinsatz" },
      { id: "02_02", title: "Rezeptkalkulation" },
      { id: "02_03", title: "Food-Cost-Formel" },
      { id: "02_04", title: "Häufige Fehler" },
      { id: "02_05", title: "Abschluss" },
    ]
  },
  {
    title: "Preise richtig setzen",
    lessons: [
      { id: "03_01", title: "Preis aus eigenen Zahlen" },
      { id: "03_02", title: "Die Preisformel" },
      { id: "03_03", title: "Psychologie der Preisgestaltung" },
      { id: "03_04", title: "Kostenfresser erkennen" },
      { id: "03_05", title: "Preise erhöhen" },
      { id: "03_06", title: "Abschluss" },
    ]
  },
  {
    title: "Personal & Fixkosten",
    lessons: [
      { id: "04_01", title: "Personalkosten — der häufige Fehler" },
      { id: "04_02", title: "Personalkosten in %" },
      { id: "04_03", title: "Fixkosten" },
      { id: "04_04", title: "Gesamtkostenformel" },
      { id: "04_05", title: "Kosten senken" },
      { id: "04_06", title: "Abschluss" },
    ]
  },
  {
    title: "Break-Even",
    lessons: [
      { id: "05_01", title: "Was ist Break-Even?" },
      { id: "05_02", title: "Break-Even-Formel" },
      { id: "05_03", title: "Break-Even in Gästen & Tagen" },
      { id: "05_04", title: "Rückwärts planen" },
      { id: "05_05", title: "Break-Even nicht erreicht" },
      { id: "05_06", title: "Abschluss" },
    ]
  },
  {
    title: "Das System etablieren",
    lessons: [
      { id: "06_01", title: "Alles zusammenführen" },
      { id: "06_02", title: "Monatliche Kontrollroutine" },
      { id: "06_03", title: "Preise erhöhen — wann & wie" },
      { id: "06_04", title: "Die Vorlage" },
      { id: "06_05", title: "30-Tage-Umsetzungsplan" },
      { id: "06_06", title: "Abschluss & Verabschiedung" },
    ]
  }
];

const allLessons = [];
curriculum.forEach((mod, mi) => {
  mod.lessons.forEach((les, li) => allLessons.push({ modIdx: mi, lesIdx: li, ...les }));
});
const TOTAL = allLessons.length;

const FILE_MAP = {
  "01_01":"01_01_Willkommen","01_02":"01_02_Warum_Preise_falsch_sind",
  "01_03":"01_03_Die_3_wichtigen_Zahlen","01_04":"01_04_Wie_alles_zusammenhaengt",
  "02_01":"02_01_Einfuehrung_Wareneinsatz","02_02":"02_02_Rezeptkalkulation",
  "02_03":"02_03_Food_Cost_Formel","02_04":"02_04_Haeufige_Fehler","02_05":"02_05_Abschluss",
  "03_01":"03_01_Preis_aus_eigenen_Zahlen","03_02":"03_02_Die_Preisformel",
  "03_03":"03_03_Psychologie_Preisgestaltung","03_04":"03_04_Kostenfresser_erkennen",
  "03_05":"03_05_Preise_erhoehen","03_06":"03_06_Abschluss",
  "04_01":"04_01_Personalkosten_Fehler","04_02":"04_02_Personalkosten_Prozent",
  "04_03":"04_03_Fixkosten","04_04":"04_04_Gesamtkostenformel",
  "04_05":"04_05_Kosten_senken","04_06":"04_06_Abschluss",
  "05_01":"05_01_Was_ist_Break_Even","05_02":"05_02_Break_Even_Formel",
  "05_03":"05_03_Break_Even_Gaeste_Tage","05_04":"05_04_Rueckwaerts_planen",
  "05_05":"05_05_Break_Even_nicht_erreicht","05_06":"05_06_Abschluss",
  "06_01":"06_01_Alles_zusammenfuehren","06_02":"06_02_Monatliche_Kontrollroutine",
  "06_03":"06_03_Preise_erhoehen_wann_wie","06_04":"06_04_Die_Vorlage",
  "06_05":"06_05_Umsetzungsplan","06_06":"06_06_Abschluss_Verabschiedung",
};

function videoPath(id) {
  return `/kurs/videos/Modul_${parseInt(id.substring(0,2))}/${FILE_MAP[id]}.mp4`;
}

// ── PROGRESS / DONE ──
function getProgress() {
  try { return JSON.parse(localStorage.getItem('kurs_done') || '{}'); } catch { return {}; }
}
function setDone(id) {
  const p = getProgress(); p[id] = true;
  localStorage.setItem('kurs_done', JSON.stringify(p));
}
function isDone(id) { return !!getProgress()[id]; }

// ── POSITION PERSISTENCE ──
function savePos(id, time) {
  try {
    const pos = JSON.parse(localStorage.getItem('kurs_pos') || '{}');
    if (time > 5) pos[id] = Math.floor(time);
    else delete pos[id];
    localStorage.setItem('kurs_pos', JSON.stringify(pos));
  } catch {}
}
function getPos(id) {
  try { return JSON.parse(localStorage.getItem('kurs_pos') || '{}')[id] || 0; } catch { return 0; }
}

// ── CUSTOM CONTROLS ──
const player = document.getElementById('player');
const videoArea = document.getElementById('video-area');
const progressWrap = document.getElementById('v-progress-wrap');
let scrubbing = false;
let lastSaveTime = 0;

player.addEventListener('timeupdate', () => {
  if (scrubbing || !player.duration) return;
  const pct = player.currentTime / player.duration;
  updateProgressBar(pct);
  document.getElementById('v-time').textContent = `${fmtTime(player.currentTime)} / ${fmtTime(player.duration)}`;
  const now = Math.floor(player.currentTime);
  if (currentIdx >= 0 && now !== lastSaveTime && now % 4 === 0) {
    lastSaveTime = now;
    savePos(allLessons[currentIdx].id, player.currentTime);
  }
});

function fmtTime(s) {
  if (!s || isNaN(s)) return '0:00';
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return `${m}:${sec.toString().padStart(2, '0')}`;
}

function updateProgressBar(pct) {
  const fill = document.getElementById('v-progress-fill');
  const thumb = document.getElementById('v-progress-thumb');
  fill.style.width = (pct * 100) + '%';
  thumb.style.left = (pct * 100) + '%';
}

function setPlayBtnIcon(playing) {
  document.getElementById('v-play-btn').innerHTML = playing
    ? `<svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>`
    : `<svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>`;
}

function showFlash(playing) {
  const ring = document.getElementById('v-flash-ring');
  const icon = document.getElementById('v-flash-icon');
  icon.innerHTML = playing
    ? `<polygon points="5 3 19 12 5 21 5 3" fill="#F0B650" stroke="none"/>`
    : `<rect x="6" y="4" width="4" height="16" rx="1" fill="#F0B650"/><rect x="14" y="4" width="4" height="16" rx="1" fill="#F0B650"/>`;
  ring.classList.remove('hide');
  ring.classList.add('show');
  setTimeout(() => { ring.classList.remove('show'); ring.classList.add('hide'); }, 180);
}

function togglePlay() {
  if (!videoArea.classList.contains('has-src')) return;
  if (player.paused) {
    player.play();
    showFlash(true);
  } else {
    player.pause();
    showFlash(false);
  }
}

function handleVideoClick(e) {
  if (e.target.closest('.v-controls')) return;
  togglePlay();
}

player.addEventListener('play', () => {
  videoArea.classList.remove('paused');
  setPlayBtnIcon(true);
});
player.addEventListener('pause', () => {
  videoArea.classList.add('paused');
  setPlayBtnIcon(false);
});
player.addEventListener('loadedmetadata', () => {
  document.getElementById('v-time').textContent = `0:00 / ${fmtTime(player.duration)}`;
});

// speed
function changeSpeed(val) {
  player.playbackRate = parseFloat(val);
  localStorage.setItem('kurs_speed', val);
}

// fullscreen
function toggleFullscreen() {
  if (!document.fullscreenElement) {
    videoArea.requestFullscreen().catch(() => {});
  } else {
    document.exitFullscreen();
  }
}
document.addEventListener('fullscreenchange', () => {
  const btn = document.getElementById('v-fs-btn');
  if (document.fullscreenElement) {
    btn.innerHTML = `<svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M8 3v3a2 2 0 01-2 2H3m18 0h-3a2 2 0 01-2-2V3m0 18v-3a2 2 0 012-2h3M3 16h3a2 2 0 012 2v3"/></svg>`;
  } else {
    btn.innerHTML = `<svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 00-2 2v3m18 0V5a2 2 0 00-2-2h-3m0 18h3a2 2 0 002-2v-3M3 16v3a2 2 0 002 2h3"/></svg>`;
  }
});

// keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (!videoArea.classList.contains('has-src')) return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  if (e.code === 'ArrowRight') { e.preventDefault(); player.currentTime = Math.min(player.duration, player.currentTime + 10); }
  if (e.code === 'ArrowLeft') { e.preventDefault(); player.currentTime = Math.max(0, player.currentTime - 10); }
  if (e.code === 'KeyF') toggleFullscreen();
});

// scrubbing
function getScrubPct(e) {
  const rect = progressWrap.getBoundingClientRect();
  return Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
}
progressWrap.addEventListener('mousedown', (e) => {
  scrubbing = true;
  progressWrap.classList.add('scrubbing');
  const pct = getScrubPct(e);
  updateProgressBar(pct);
  document.getElementById('v-time').textContent = `${fmtTime(pct * player.duration)} / ${fmtTime(player.duration)}`;
});
document.addEventListener('mousemove', (e) => {
  if (!scrubbing) return;
  const pct = getScrubPct(e);
  updateProgressBar(pct);
  document.getElementById('v-time').textContent = `${fmtTime(pct * player.duration)} / ${fmtTime(player.duration)}`;
});
document.addEventListener('mouseup', (e) => {
  if (!scrubbing) return;
  scrubbing = false;
  progressWrap.classList.remove('scrubbing');
  player.currentTime = getScrubPct(e) * player.duration;
});

// touch scrubbing
progressWrap.addEventListener('touchstart', (e) => {
  scrubbing = true;
  progressWrap.classList.add('scrubbing');
}, { passive: true });
document.addEventListener('touchmove', (e) => {
  if (!scrubbing) return;
  const touch = e.touches[0];
  const rect = progressWrap.getBoundingClientRect();
  const pct = Math.max(0, Math.min(1, (touch.clientX - rect.left) / rect.width));
  updateProgressBar(pct);
  document.getElementById('v-time').textContent = `${fmtTime(pct * player.duration)} / ${fmtTime(player.duration)}`;
}, { passive: true });
document.addEventListener('touchend', (e) => {
  if (!scrubbing) return;
  scrubbing = false;
  progressWrap.classList.remove('scrubbing');
  const touch = e.changedTouches[0];
  const rect = progressWrap.getBoundingClientRect();
  const pct = Math.max(0, Math.min(1, (touch.clientX - rect.left) / rect.width));
  player.currentTime = pct * player.duration;
});

// ── LESSON LOADING ──
let currentIdx = -1;

function loadLesson(idx) {
  if (idx < 0 || idx >= TOTAL) return;

  if (currentIdx >= 0) savePos(allLessons[currentIdx].id, player.currentTime);
  currentIdx = idx;
  const lesson = allLessons[idx];

  videoArea.classList.add('has-src');
  videoArea.classList.add('paused');
  document.getElementById('placeholder').style.display = 'none';

  updateProgressBar(0);
  document.getElementById('v-time').textContent = '0:00 / 0:00';

  player.src = videoPath(lesson.id);
  player.load();
  setPlayBtnIcon(false);

  // restore speed preference
  const savedSpeed = localStorage.getItem('kurs_speed') || '1';
  document.getElementById('v-speed').value = savedSpeed;
  player.playbackRate = parseFloat(savedSpeed);

  player.addEventListener('loadedmetadata', () => {
    const savedPos = getPos(lesson.id);
    if (savedPos > 5 && savedPos < player.duration - 5) {
      player.currentTime = savedPos;
    }
    player.play().catch(() => {});
  }, { once: true });

  player.onended = () => {
    savePos(lesson.id, 0);
    setDone(lesson.id);
    updateProgress();
    renderSidebar();
    if (idx + 1 < TOTAL) loadLesson(idx + 1);
  };

  document.getElementById('current-badge').textContent =
    `Modul ${lesson.modIdx + 1} · Lektion ${lesson.lesIdx + 1}`;
  document.getElementById('current-title').textContent = lesson.title;
  document.getElementById('btn-prev').disabled = idx === 0;
  document.getElementById('btn-next').disabled = idx === TOTAL - 1;

  location.hash = lesson.id;
  renderSidebar();
  updateProgress();
  document.getElementById('sidebar').classList.remove('open');
}

function navLesson(dir) {
  if (currentIdx >= 0) setDone(allLessons[currentIdx].id);
  loadLesson(currentIdx + dir);
  updateProgress();
}

function updateProgress() {
  const done = Object.keys(getProgress()).length;
  document.getElementById('progress-fill').style.width = Math.round(done / TOTAL * 100) + '%';
  document.getElementById('progress-label').textContent = `${done} / ${TOTAL}`;
}

function renderSidebar() {
  let html = '';
  curriculum.forEach((mod, mi) => {
    const modDone = mod.lessons.filter(l => isDone(l.id)).length;
    const isActive = currentIdx >= 0 && allLessons[currentIdx].modIdx === mi;
    html += `
      <div class="module-block">
        <div class="module-header ${isActive ? 'active open' : ''}" onclick="toggleModule(this)">
          <div>
            <div class="mod-num">Modul ${String(mi + 1).padStart(2, '0')}</div>
            <div class="mod-title">${mod.title}</div>
            <div class="mod-meta">${modDone} / ${mod.lessons.length} abgeschlossen</div>
          </div>
          <svg class="chevron" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
        </div>
        <div class="lessons-list ${isActive ? 'open' : ''}">`;
    mod.lessons.forEach((les) => {
      const globalIdx = allLessons.findIndex(l => l.id === les.id);
      const done = isDone(les.id);
      const active = currentIdx === globalIdx;
      html += `
        <div class="lesson-item ${active ? 'active' : ''} ${done ? 'done' : ''}" onclick="loadLesson(${globalIdx})">
          <div class="check-circle">
            ${done ? `<svg width="9" height="9" fill="none" viewBox="0 0 24 24" stroke="#0C0B09" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>` : ''}
          </div>
          <span class="les-title">${les.title}</span>
        </div>`;
    });
    html += `</div></div>`;
  });
  document.getElementById('sidebar').innerHTML = html;
}

function toggleModule(el) {
  el.classList.toggle('open');
  el.nextElementSibling.classList.toggle('open');
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}

// ── PASSWORD GATE ──
// Passwort hier ändern:
const COURSE_PW = 'GastroKurs2026';

function checkGate() {
  const val = document.getElementById('gate-input').value;
  if (val === COURSE_PW) {
    localStorage.setItem('kurs_access', '1');
    document.getElementById('gate').style.display = 'none';
  } else {
    document.getElementById('gate-error').textContent = 'Falsches Passwort — bitte prüfe deine Bestätigungsmail.';
    document.getElementById('gate-input').value = '';
    document.getElementById('gate-input').focus();
  }
}

if (localStorage.getItem('kurs_access') === '1') {
  document.getElementById('gate').style.display = 'none';
} else {
  document.getElementById('gate').style.display = 'flex';
  setTimeout(() => document.getElementById('gate-input').focus(), 100);
}

renderSidebar();
updateProgress();
const hash = location.hash.replace('#', '');
loadLesson(hash ? Math.max(0, allLessons.findIndex(l => l.id === hash)) : 0);
</script>

</body>
</html>
